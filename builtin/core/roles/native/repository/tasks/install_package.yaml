---
- name: Repository | Check current host debian or rhel
  set_fact:
    current_host_type: >-
      {{- if .os.release.ID_LIKE | eq "debian" }}
      ubuntu
      {{- else if .os.release.ID_LIKE | unquote | eq "rhel fedora" }}
      centos
      {{- else if .os.release.ID | unquote | eq "kylin" }}
      centos
      {{- end -}}

- name: Repository | Initialize Debian-based repository and install required system packages
  command: |
    now=$(date +"%Y%m%d%H%M%S")
    # nftables is appended when kube-proxy runs in nftables mode. When the inventory
    # defines a non-empty "nfs" group, the NFS server package is installed on the
    # nodes of that group and the NFS client package on all other nodes.
    PKGS="{{ .native.packages.debs | default list | join " " }}{{ if .kubernetes.kube_proxy.mode | default "iptables" | eq "nftables" }} nftables{{ end }}{{ if .groups.nfs | default list | has .inventory_hostname }} nfs-kernel-server{{ else if .groups.nfs | default list | empty | not }} nfs-common{{ end }}"
    PKGS_TO_INSTALL=""
    for pkg in $PKGS; do
      [ -n "$pkg" ] || continue
      # native.packages.debs holds real Debian package names, so the dpkg status
      # database is authoritative and no binary-name probe is needed.
      dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed" \
        || PKGS_TO_INSTALL="$PKGS_TO_INSTALL $pkg"
    done

    restore_apt_sources() {
      if [ -d /etc/apt/sources.list.d.kubekey-$now.bak ]; then
        rm -rf /etc/apt/sources.list.d
        mv /etc/apt/sources.list.d.kubekey-$now.bak /etc/apt/sources.list.d
      fi
      if [ -f /etc/apt/sources.list.kubekey-$now.bak ]; then
        mv /etc/apt/sources.list.kubekey-$now.bak /etc/apt/sources.list
      fi
    }

    if [ -f "{{ .tmp_dir }}/repository.iso" ]; then
      # Backup current APT sources
      mv /etc/apt/sources.list /etc/apt/sources.list.kubekey-$now.bak
      mv /etc/apt/sources.list.d /etc/apt/sources.list.d.kubekey-$now.bak
      mkdir -p /etc/apt/sources.list.d
      # Configure local repository
      rm -rf /etc/apt/sources.list.d/*
      echo 'deb [trusted=yes] file://{{ .tmp_dir }}/iso /' > /etc/apt/sources.list.d/kubekey.list
      # Update package index
      apt-get update
      # Install missing packages. The installer status is kept in rc because
      # restore_apt_sources must still run, so a failed install does not leave the
      # node pointed at the temporary ISO source; its 'mv' would otherwise become
      # the last command of this task and mask the failure.
      rc=0
      if [ -n "$PKGS_TO_INSTALL" ]; then
        apt-get install -y $PKGS_TO_INSTALL || rc=$?
      fi
      restore_apt_sources
      [ "$rc" -eq 0 ] || exit "$rc"
    else
      # No local ISO found, using default repositories. No sources are swapped
      # here, so the installer exit status already propagates.
      apt-get update
      if [ -n "$PKGS_TO_INSTALL" ]; then
        apt-get install -y $PKGS_TO_INSTALL
      fi
    fi
  when: .current_host_type | trim | eq "ubuntu"

- name: Repository | Initialize RHEL-based repository and install required system packages
  command: |
    BACKUP_FILE="/etc/yum.repos.d.kubekey.bak-$(date +%Y%m%d%H%M%S)"
    # nftables is appended when kube-proxy runs in nftables mode. When the inventory
    # defines a non-empty "nfs" group, nfs-utils is installed on every node: the RPM
    # provides both the NFS server and the NFS client, so no per-node split is needed.
    PKGS="{{ .native.packages.rpms | default list | join " " }}{{ if .kubernetes.kube_proxy.mode | default "iptables" | eq "nftables" }} nftables{{ end }}{{ if .groups.nfs | default list | empty | not }} nfs-utils{{ end }}"
    PKGS_TO_INSTALL=""
    for pkg in $PKGS; do
      [ -n "$pkg" ] || continue
      # native.packages.rpms holds real RPM package names, so the rpm database is
      # authoritative and no binary-name probe is needed.
      rpm -q --quiet "$pkg" 2>/dev/null \
        || PKGS_TO_INSTALL="$PKGS_TO_INSTALL $pkg"
    done

    restore_yum_repos() {
      if [ -d "$BACKUP_FILE" ]; then
        rm -rf /etc/yum.repos.d
        mv "$BACKUP_FILE" /etc/yum.repos.d
      fi
    }

    if [ -f "{{ .tmp_dir }}/repository.iso" ]; then
      # Backup current YUM repositories
      mv /etc/yum.repos.d "$BACKUP_FILE"
      mkdir -p /etc/yum.repos.d
      # Configure local repository
      rm -rf /etc/yum.repos.d/*
      cat <<EOF > /etc/yum.repos.d/CentOS-local.repo
    [base-local]
    name=Local RPM Repository
    baseurl=file://{{ .tmp_dir }}/iso
    enabled=1
    gpgcheck=0
    EOF
      # Refresh repository cache
      yum clean all && yum makecache
      # Install missing packages. The installer status is kept in rc because
      # restore_yum_repos must still run, so a failed install does not leave the
      # node pointed at the temporary ISO source; its 'mv' would otherwise become
      # the last command of this task and mask the failure.
      rc=0
      if [ -n "$PKGS_TO_INSTALL" ]; then
        yum install -y $PKGS_TO_INSTALL || rc=$?
      fi
      restore_yum_repos
      [ "$rc" -eq 0 ] || exit "$rc"
    else
      # No local ISO found, using default repositories. No repositories are
      # swapped here, so the installer exit status already propagates.
      if [ -n "$PKGS_TO_INSTALL" ]; then
        yum install -y $PKGS_TO_INSTALL
      fi
    fi
  when: .current_host_type | trim | eq "centos"
