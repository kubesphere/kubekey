  keepalived:
    image: osixia/keepalived:2.0.20
    container_name: keepalived
    command:
      - --copy-service
    network_mode: "host"
    restart: always
    dns_search: .
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - CHOWN
      - DAC_OVERRIDE
    depends_on:
      - registry
    volumes:
      - type: bind
        source: /opt/keepalived/2.0.20/keepalived.conf
        target: /container/service/keepalived/assets/keepalived.conf
      - type: bind
        source: /opt/keepalived/2.0.20/healthcheck.sh
        target: /etc/keepalived/healthcheck.sh