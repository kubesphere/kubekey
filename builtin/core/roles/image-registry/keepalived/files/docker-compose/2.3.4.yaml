version: '2.3'
services:
# keepalived is generated by kubekey.
  keepalived:
    image: osixia/keepalived:2.3.4
    container_name: keepalived
    network_mode: "host"
    restart: always
    dns_search: .
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
    depends_on:
      - proxy
    volumes:
      - type: bind
        source: /opt/keepalived/2.3.4/keepalived.conf
        target: /etc/keepalived/keepalived.conf
      - type: bind
        source: /opt/keepalived/2.3.4/healthcheck.sh
        target: /etc/keepalived/healthcheck.sh