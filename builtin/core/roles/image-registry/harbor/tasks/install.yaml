
- name: Harbor | Synchronize Harbor offline package to remote host
  copy:
    src: >-
      {{ .binary_dir }}/image-registry/harbor/{{ .image_registry.harbor_version }}/{{ .binary_type }}/harbor-offline-installer-{{ .image_registry.harbor_version }}.tgz
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/harbor-offline-installer-{{ .image_registry.harbor_version }}.tgz

- name: Harbor | Extract Harbor offline package
  command: |
    cd /opt/harbor/{{ .image_registry.harbor_version }}/ && tar -zxvf harbor-offline-installer-{{ .image_registry.harbor_version }}.tgz

- name: Harbor | Synchronize image registry certificate to remote host
  copy:
    src: >-
      {{ .work_dir }}/pki/image_registry.crt
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/ssl/server.crt

- name: Harbor | Synchronize image registry private key to remote host
  copy:
    src: >-
      {{ .work_dir }}/pki/image_registry.key
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/ssl/server.key

- name: Harbor | Synchronize self signed ca cert to remote host
  copy:
    src: >-
      {{ .work_dir }}/pki/root.crt
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/ssl/ca.crt

- name: Harbor | Generate Harbor configuration file
  template:
    src: harbor.yml
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/harbor/harbor.yml

# The token signing material generated by roles/certs/init is shared by every harbor node,
# so that a token issued by one instance is accepted by all others. It is staged next to the
# offline package and only copied into the data volume when the target file is absent, so
# re-running kubekey never re-keys an instance that is already serving requests. prepare only
# creates a file that is missing, hence pre-placing the material before install.sh is enough
# to make every instance use the shared material.
- name: Harbor | Synchronize the shareable token signing key to the remote host
  when: .image_registry.type | eq "harbor"
  copy:
    src: >-
      {{ .work_dir }}/pki/harbor-token.key
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/shared-secrets/private_key.pem

- name: Harbor | Synchronize the shareable token certificate to the remote host
  when: .image_registry.type | eq "harbor"
  copy:
    src: >-
      {{ .work_dir }}/pki/harbor-token.crt
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/shared-secrets/root.crt

- name: Harbor | Synchronize the shareable secret key to the remote host
  when: .image_registry.type | eq "harbor"
  copy:
    src: >-
      {{ .work_dir }}/pki/harbor-secretkey
    dest: >-
      /opt/harbor/{{ .image_registry.harbor_version }}/shared-secrets/secretkey

- name: Harbor | Install the shareable Harbor secrets into the data volume
  when: .image_registry.type | eq "harbor"
  command: |
    set -e
    secret_dir={{ .image_registry.harbor.data_dir }}/secret
    staging_dir=/opt/harbor/{{ .image_registry.harbor_version }}/shared-secrets
    mkdir -p ${secret_dir}/core ${secret_dir}/registry ${secret_dir}/keys
    install_secret() {
      if [ -s "$1" ]; then
        echo "keep existing $1"
      else
        cp "$2" "$1"
        chmod "$3" "$1"
        echo "installed shared $1"
      fi
    }
    install_secret ${secret_dir}/core/private_key.pem ${staging_dir}/private_key.pem 600
    install_secret ${secret_dir}/registry/root.crt ${staging_dir}/root.crt 644
    install_secret ${secret_dir}/keys/secretkey ${staging_dir}/secretkey 600

- name: Harbor | Install Harbor registry
  command: |
    cd /opt/harbor/{{ .image_registry.harbor_version }}/harbor && /bin/bash install.sh

# In HA mode the registry domain must resolve inside the harbor containers.
# Docker's embedded DNS does not read the host's /etc/hosts, so inject the
# domain -> ha_vip mapping and every harbor node's hostname -> IP mapping
# into every service of docker-compose.yml, mirroring the image registry
# hosts block in init-os.sh.
- name: Harbor | Inject registry domain resolution into docker-compose for HA
  when:
    - .image_registry.ha_vip | empty | not
    - .groups.image_registry | len | lt 1
    - .image_registry.auth.registry | splitList "/" | first | splitList ":" | first | empty | not
    - .image_registry.auth.registry | splitList "/" | first | splitList ":" | first | isIP | not
  command: |
    {{- $registryHost := .image_registry.auth.registry | splitList "/" | first | splitList ":" | first }}
    {{- $entries := list (printf "%s:%s" $registryHost .image_registry.ha_vip) }}
    {{- range .groups.image_registry }}
      {{- $hostname := index $.hostvars . "hostname" }}
      {{- if (index $.hostvars . "internal_ipv4") | empty | not }}
        {{- $entries = append $entries (printf "%s:%s" $hostname (index $.hostvars . "internal_ipv4")) }}
      {{- end }}
      {{- if (index $.hostvars . "internal_ipv6") | empty | not }}
        {{- $entries = append $entries (printf "%s:%s" $hostname (index $.hostvars . "internal_ipv6")) }}
      {{- end }}
    {{- end }}
    sed -i 's/^    networks:/    extra_hosts:\n{{- range $entries }}      - "{{ . }}"\n{{- end }}    networks:/' /opt/harbor/{{ .image_registry.harbor_version }}/harbor/docker-compose.yml

- name: Harbor | Disable HTTP port in docker-compose when http_port is empty
  when:
    - .image_registry.http_port | empty
  command: |
    sed -i -E '/^[[:space:]]*- 80:8080$/d' /opt/harbor/{{ .image_registry.harbor_version }}/harbor/docker-compose.yml

- name: Harbor | Register Harbor as a systemd service
  template:
    src: harbor.service
    dest: /etc/systemd/system/harbor.service

- name: Harbor | Start and enable Harbor service
  command: systemctl daemon-reload && systemctl start harbor.service && systemctl enable harbor.service

- name: Harbor | Configure HA and synchronize Harbor images
  when:
    - .image_registry.ha_vip | empty | not
    - .groups.image_registry | len | lt 1
  block:
    - name: Harbor | Wait for Harbor service to become ready
      command: |
        {{- $registryHost := .image_registry.auth.registry | splitList "/" | first | splitList ":" | first }}
        {{- if .image_registry.auth.plain_http | default false }}
        HARBOR_URL="http://{{ $registryHost }}:{{ .image_registry.http_port | default 80 }}/api/v2.0/health"
        curl_opts=""
        {{- else }}
        HARBOR_URL="https://{{ $registryHost }}:{{ .image_registry.https_port | default 443 }}/api/v2.0/health"
        curl_opts="-k"
        {{- end }}
        MAX_WAIT_SECONDS=300
        CHECK_INTERVAL=2
        MAX_RETRIES=$((MAX_WAIT_SECONDS / CHECK_INTERVAL))
        for ((i=1; i<=MAX_RETRIES; i++)); do
          # Check health endpoint
          response=$(curl $curl_opts -s -w "%{http_code}" -o /tmp/harbor_health_response.json "$HARBOR_URL")
          http_code=${response: -3}
          # Check if healthy
          if [ "$http_code" -eq 200 ] && grep -q "\"status\":\"healthy\"" /tmp/harbor_health_response.json 2>/dev/null; then
            rm -f /tmp/harbor_health_response.json
            exit 0
          fi
          # Wait before next check if not max retries reached
          if [ $i -lt $MAX_RETRIES ]; then
            sleep $CHECK_INTERVAL
          fi
        done
        # Timeout reached
        rm -f /tmp/harbor_health_response.json
        echo "ERROR: Harbor service did not became health within 5 minutes!"
        exit 1
    - name: Harbor | Create registries for other harbor
      template:
        src: harbor-registries.sh
        dest: /opt/harbor/scripts/harbor-registries.sh
        mode: 0755
    - name: Harbor | Create registries for other harbor nodes and retrieve registry list
      command: bash /opt/harbor/scripts/harbor-registries.sh
      register: install_harbor_registries
      register_type: json
    - name: Harbor | Synchronize harbor-replications script to remote host
      template:
        src: harbor-replications.sh
        dest: /opt/harbor/scripts/harbor-replications.sh
        mode: 0755
    - name: Harbor | Execute harbor-replications script
      command: bash /opt/harbor/scripts/harbor-replications.sh
