---
# The following checks validate cluster-wide CRI configuration and should only
# run once on the localhost. Per-node runtime-state checks (containerd v2 glibc /
# kernel compatibility, Docker live-restore) also live in this role. The role is
# scheduled on every target host (no `when` in precheck/meta/main.yaml, matching
# upstream main), and each task's own `when` scopes it to localhost or the
# relevant Kubernetes node.
- name: CRI | Fail if container manager is not docker or containerd
  when: .inventory_hostname | eq "localhost"
  assert:
    that: .cluster_require.require_container_manager | has .cri.container_manager
    fail_msg: >-
      The specified container manager "{{ .cri.container_manager }}" is not supported. Please use one of the following: {{ .cluster_require.require_container_manager | toJson }}.

- name: CRI | Validate target containerd version when upgrading cri
  when:
    - .inventory_hostname | eq "localhost"
    - .cri.containerd_version | empty | not
    - .cri.container_manager | eq "containerd"
    - .upgrade.cri
  assert:
    that: .cri.containerd_version | semverCompare (printf ">=%s" .cluster_require.containerd_min_version_required)
    fail_msg: >-
      The specified containerd version ({{ .cri.containerd_version }}) is below the minimum required version: {{ .cluster_require.containerd_min_version_required }}.

# The following checks inspect the actual container runtime state on each
# Kubernetes node.
# containerd v2 release assets are built against glibc 2.35 (Ubuntu 22.04). On a
# node with an older glibc the dynamically linked binary fails at startup, and
# KubeKey must download the statically linked "containerd-static-*" asset instead
# (cri.containerd.static_binary). The statically linked binary does not relax
# containerd v2's own kernel floor (the overlayfs snapshotter needs a 4.x
# kernel), so the kernel is checked separately: below that floor there is no
# asset that works and the node has to be upgraded.
- name: CRI | Fail if containerd v2 is incompatible with this node
  when:
    - .groups.k8s_cluster | default list | has .inventory_hostname
    - .cri.container_manager | eq "containerd"
  block:
    - name: CRI | Detect the glibc version of this node
      ignore_errors: true
      command: getconf GNU_LIBC_VERSION 2>/dev/null | awk '{print $2}'
      register: glibc_version

    - name: CRI | Fail if containerd v2 runs on a kernel older than its minimum
      when:
        - .cri.containerd_version | empty | not
        - .cri.containerd_version | semverCompare ">=v2.0.0"
      assert:
        that: .os.kernel_version | splitList "-" | first | semverCompare (printf ">=%s" .cluster_require.containerd_v2_min_kernel_version)
        fail_msg: >-
          Containerd {{ .cri.containerd_version }} requires kernel
          {{ .cluster_require.containerd_v2_min_kernel_version }} or later, but this node runs kernel
          {{ .os.kernel_version }}. The statically linked containerd binary does not remove this
          requirement, so upgrade the kernel or use a newer distribution before installing
          containerd v2.

    # The glibc probe returns empty on non-glibc (e.g. musl) systems, where the
    # version cannot be compared; skip the check instead of guessing.
    - name: CRI | Fail if containerd v2 needs the statically linked binary on this node
      when:
        - .cri.containerd_version | empty | not
        - .cri.containerd_version | semverCompare ">=v2.0.0"
        - index (.glibc_version | default dict) "stdout" | default "" | trim | empty | not
      assert:
        that: or (.cri.containerd.static_binary | default false) (index (.glibc_version | default dict) "stdout" | trim | semverCompare (printf ">=%s" .cluster_require.containerd_v2_min_glibc_version))
        fail_msg: >-
          The dynamically linked containerd {{ .cri.containerd_version }} binary requires glibc
          {{ .cluster_require.containerd_v2_min_glibc_version }} or later, but this node reports glibc
          {{ .glibc_version.stdout | trim }}. Set "cri.containerd.static_binary" to true so KubeKey
          downloads the statically linked "containerd-static-*" release asset, or upgrade the
          operating system.


- name: CRI | Check Docker live-restore status before upgrading CRI
  when:
    - .groups.k8s_cluster | default list | has .inventory_hostname
    - .cri.container_manager | eq "docker"
    - .upgrade.cri
  block:
    - name: CRI | Detect live-restore in Docker daemon.json
      ignore_errors: true
      command: |
        if [ -f /etc/docker/daemon.json ] && grep -qE '"live-restore"[[:space:]]*:[[:space:]]*true' /etc/docker/daemon.json; then
          echo "enabled"
        else
          echo "disabled"
        fi
      register: docker_live_restore_status

    - name: CRI | Warn if Docker live-restore is disabled
      when:
        - .docker_live_restore_status.error | empty
        - .docker_live_restore_status.stdout | eq "disabled"
      debug:
        msg: >-
          WARNING: Docker live-restore is not enabled on this node.
          When upgrade.cri=true, the Docker daemon will be restarted and running
          containers may be interrupted. To reduce the risk, enable
          "live-restore": true in /etc/docker/daemon.json, or ensure workload
          replicas are distributed across worker nodes.

# The kubelet and the container runtime must use the same cgroup driver. Both are
# driven by `cri.cgroup_driver` at init, but an in-place upgrade (in particular
# `upgrade.cri` with a containerd version bump) re-renders the runtime config to
# SystemdCgroup while the kubelet config may still carry an older value. The
# upgrade role reconciles the kubelet to `cri.cgroup_driver` on existing nodes, but
# a node that was provisioned with a mismatch (containerd systemd, kubelet cgroupfs)
# makes runc fail with "expected cgroupsPath to be of format slice:prefix:name",
# taking down kube-vip and then the whole control plane. Warn early if a node is
# already in that state so the operator can fix it before the upgrade.
- name: CRI | Detect current kubelet and containerd cgroup drivers on the node
  when:
    - .groups.k8s_cluster | default list | has .inventory_hostname
    - .cri.container_manager | eq "containerd"
  ignore_errors: true
  command: |
    kd=""
    if [ -f /var/lib/kubelet/config.yaml ]; then
      kd=$(grep -E '^cgroupDriver:' /var/lib/kubelet/config.yaml | awk '{print $2}')
    fi
    cd=""
    if [ -f /etc/containerd/config.toml ]; then
      if grep -qE 'SystemdCgroup[[:space:]]*=[[:space:]]*true' /etc/containerd/config.toml; then
        cd="systemd"
      elif grep -qE 'SystemdCgroup' /etc/containerd/config.toml; then
        cd="cgroupfs"
      fi
    fi
    if [ -z "${kd}" ] || [ -z "${cd}" ]; then
      echo "unknown"
    elif [ "${kd}" = "${cd}" ]; then
      echo "match"
    else
      echo "mismatch:${kd}/${cd}"
    fi
  register: cgroup_current_state

- name: CRI | Warn if a node already has a kubelet/runtime cgroup driver mismatch
  when:
    - .cgroup_current_state.error | empty
    - .cgroup_current_state.stdout | regexMatch "^mismatch:"
  debug:
    msg: >-
      WARNING: node {{ .inventory_hostname }} has kubelet cgroupDriver
      ({{ .cgroup_current_state.stdout | trimPrefix "mismatch:" | splitList "/" | first }})
      != containerd SystemdCgroup
      ({{ .cgroup_current_state.stdout | trimPrefix "mismatch:" | splitList "/" | last }}).
      KubeKey reconciles the kubelet to "{{ .cri.cgroup_driver }}" during
      `kk upgrade` (kubernetes/upgrade-kubernetes). If you are not running an upgrade,
      fix it manually before the mismatch breaks static pods such as kube-vip.
