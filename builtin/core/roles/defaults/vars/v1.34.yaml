kubernetes:
  # helm binary
  helm_version: v3.18.5
  sandbox_image:
    tag: "3.10.1"
  control_plane_endpoint:
    kube_vip:
      image:
        tag: v0.7.2
    haproxy:
      image:
        tag: 2.9.6-alpine
  # kube-proxy proxy mode. Kubernetes v1.34 deprecates ipvs (it is removed in
  # v1.36) and recommends nftables, which has been GA since v1.33. The nftables
  # backend defaults match the iptables tuning values in the kube_proxy config,
  # so switching the mode needs no extra config block.
  kube_proxy:
    mode: "nftables"
etcd:
  # etcd binary
  etcd_version: v3.6.5
image_registry:
  # ========== image registry ==========
  # keepalived image tag. Used for load balancing when there are multiple image registry nodes.
  keepalived_version: 2.3.4
  # ========== image registry: harbor ==========
  # harbor image tag
  harbor_version: v2.10.2
  # docker-compose binary
  dockercompose_version: v2.20.3
  # ========== image registry: docker-registry ==========
  # docker-registry image tag
  docker_registry_version: 2.8.3
cri:
  # support: containerd,docker
  container_manager: containerd
  # ========== cri ==========
  # crictl binary
  crictl_version: v1.34.0
  # ========== cri: docker ==========
  # docker binary
  docker_version: 25.0.5
  # cridockerd. Required when kube_version is greater than 1.24
  cridockerd_version: v0.3.21
  # ========== cri: containerd ==========
  # containerd binary
  containerd_version: v1.7.13
  # runc binary
  runc_version: v1.1.12
cni:
  # ========== cni ==========
  # cni_plugins binary provides standard CNI plugins (loopback, bridge, macvlan, host-local, etc.).
  # Multus delegates network setup to these plugins, and Kubelet requires loopback to create the
  # pod loopback interface. Without them in /opt/cni/bin/, multi-CNI deployments will fail.
  cni_plugins_version: v1.9.1
  # ========== cni: calico ==========
  # calicoctl binary
  calico_version: v3.32.2
  # ========== cni: cilium ==========
  # cilium helm
  cilium_version: 1.19.7
  # ========== cni: flannel ==========
  flannel_version: v0.27.4
  # ========== cni: kubeovn ==========
  # kubeovn helm
  kubeovn_version: v1.15.0
  # ========== cni: hybridnet ==========
  # hybridnet helm
  hybridnet_version: 0.6.8
  # ========== multi-cni: multus ==========
  multus:
    image:
      tag: v4.2.4
  # ========== multi-cni: spiderpool ==========
  spiderpool_version: v1.1.1
storage_class:
  # ========== storageclass ==========
  # ========== storageclass: local ==========
  # openebs/dynamic-localpv-provisioner helm chart version.
  localpv_provisioner_version: 4.4.0
  # ========== storageclass: nfs ==========
  # nfs provisioner helm version
  nfs_provisioner_version: 4.0.18
dns:
  # CoreDNS settings.
  coredns:
    image:
      tag: v1.12.1
  # NodeLocalDNS settings.
  nodelocaldns:
    image:
      tag: 1.26.4