kubernetes:
  # helm binary
  helm_version: v3.8.2
  sandbox_image:
    tag: "3.6"
  control_plane_endpoint:
    kube_vip:
      image:
        tag: v0.7.2
    haproxy:
      image:
        tag: 2.9.6-alpine
etcd:
  # etcd binary
  etcd_version: v3.5.6
image_registry:
  # keepalived image tag. Used for load balancing when there are multiple image registry nodes.
  keepalived_version: 2.3.4
  # ========== image registry: harbor ==========
  # Harbor image tag (only valid if type is harbor).
  harbor_version: v2.10.2
  # docker-compose binary
  dockercompose_version: v2.20.3
  # ========== image registry: docker-registry ==========
  # docker-registry image tag
  docker_registry_version: 2.8.3
cri:
  # support: containerd,docker
  container_manager: docker
  # ========== cri ==========
  # crictl binary
  crictl_version: v1.23.0
  # ========== cri: docker ==========
  # docker binary
  docker_version: 23.0.6
  # cridockerd. Required for Kubernetes v1.24 and later.
  cridockerd_version: v0.4.7
  # ========== cri: containerd ==========
  # containerd binary. Matches the containerd bundled in the docker static package above.
  containerd_version: v1.6.21
  # runc binary. Matches the runc bundled in the docker static package above.
  runc_version: v1.1.7
cni:
  # ========== cni ==========
  # cni_plugins binary provides standard CNI plugins (loopback, bridge, macvlan, host-local, etc.).
  # Multus delegates network setup to these plugins, and Kubelet requires loopback to create the
  # pod loopback interface. Without them in /opt/cni/bin/, multi-CNI deployments will fail.
  cni_plugins_version: v1.9.1
  # ========== cni: calico ==========
  # calicoctl binary
  calico_version: v3.25.2
  # ========== cni: cilium ==========
  # cilium helm
  cilium_version: 1.14.19
  # ========== cni: flannel ==========
  flannel_version: v0.27.4
  # ========== cni: kubeovn ==========
  # kubeovn helm
  kubeovn_version: v1.13.15
  # ========== cni: hybridnet ==========
  # hybridnet helm
  hybridnet_version: 0.6.8
  # ========== multi-cni: multus ==========
  multus:
    image:
      tag: v4.2.4
  # ========== multi-cni: spiderpool ==========
  spiderpool_version: v1.1.1
storage_class:
  # ========== storageclass ==========
  # ========== storageclass: local ==========
  # openebs/dynamic-localpv-provisioner helm chart version.
  localpv_provisioner_version: 4.4.0
  # ========== storageclass: nfs ==========
  # nfs provisioner helm version
  nfs_provisioner_version: 4.0.18
dns:
  # CoreDNS settings.
  coredns:
    image:
      tag: v1.8.6
  # NodeLocalDNS settings.
  nodelocaldns:
    image:
      tag: 1.21.1