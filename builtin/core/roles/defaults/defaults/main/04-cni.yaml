cni:
  # CNI plugin to use
  # Specify the network plugin to install for the cluster. Supported: calico, cilium, flannel, kubeovn, other
  type: calico
  # The complete Pod IP pool for the cluster. Single-stack keeps one address
  # family, while a dual-stack cluster lists both families, IPv4 first, as
  # "ipv4_cidr,ipv6_cidr". Unless the value is left as is, the address families
  # must match the Service CIDR below and the addresses of every node, so a
  # dual-stack value requires both "internal_ipv4" and "internal_ipv6" in the
  # inventory, and a single-stack value requires exactly one of them.
  pod_cidr: 10.233.64.0/18
  # IPv4 subnet mask length for pod allocation per node. Determines the size of each node's pod IP pool.
  ipv4_mask_size: 24
  # IPv6 subnet mask length for pod allocation per node.
  ipv6_mask_size: 64
  # The complete Service IP pool for the cluster, in the same format as pod_cidr. Must use the same address families, in the same order, as pod_cidr.
  service_cidr: 10.233.0.0/18
  # The per-family values are not stored here: every consumer splits pod_cidr on
  # "," itself, where the first entry is the IPv4 side and the last entry the
  # IPv6 side.

  # Multi-CNI type. Supported: multus, none.
  multi_cni: "none"
  # Network enhancement plugin for multiple pod network interfaces (Multus)
  multus:
    image:
      registry: >-
        {{ .image_registry.ghcrio_registry }}
      repository: k8snetworkplumbingwg/multus-cni
      # tag: v4.3.0

