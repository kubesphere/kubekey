- name: Defaults | Reset temporary directory
  tags: ["always"]
  command: |
    if [ -d {{ .tmp_dir }} ]; then
      rm -rf {{ .tmp_dir }}
    fi
    mkdir -m 777 -p {{ .tmp_dir }}

- name: Defaults | Load defaults based on Kubernetes version
  block:
    - name: Defaults | Load version-specific settings for Kubernetes
      tags: ["always"]
      when: .kubernetes.kube_version | empty | not
      include_vars: >-
        {{ slice (.kubernetes.kube_version | splitList ".") 0 2 | join "." }}.yaml
    - name: Defaults | Load default templates download
      tags: ["package", "pull", "never"]
      template:
        src: manifests.yaml
        dest: >-
          {{ .binary_dir }}/manifests.yaml

- name: Defaults | Determine operating system architecture for each node
  tags: ["always"]
  set_fact:
    binary_type: >-
      {{- if .transform_architectures.amd64 | has .os.architecture -}}
      amd64
      {{- else if .transform_architectures.arm64 | has .os.architecture -}}
      arm64
      {{- end -}}

- name: Defaults | Gather Kubernetes service status
  when: .groups.k8s_cluster | has .inventory_hostname
  block:
    - name: Defaults | Get kubelet.service LoadState
      command: systemctl show kubelet.service -p LoadState --value
      register: kubernetes_install_LoadState
    - name: Defaults | Get kubelet.service ActiveState
      command: systemctl show kubelet.service -p ActiveState --value
      register: kubernetes_install_ActiveState
    - name: Defaults | Get installed Kubernetes version
      ignore_errors: true
      command: kubelet --version
      register: kubernetes_install_version
    - name: Defaults | Get running Kubernetes version from the cluster
      # During an upgrade the on-disk kube binaries may already have been bumped
      # ahead of the actually-running cluster (e.g. after a previously failed step
      # re-ran pre-kubernetes). The upgrade-path validation must therefore compare
      # against the *running* cluster version, not the on-disk binary version.
      # kubectl is invoked with an explicit --kubeconfig and full binary path because
      # KubeKey runs privileged tasks as root via sudo with a stripped environment, so
      # kubectl's default kubeconfig discovery (which relies on $HOME) would otherwise
      # fail silently and leave the variable empty. The fallback chain prefers the
      # root-readable admin.conf, then /root/.kube/config, then $HOME/.kube/config so
      # the command works whether the task executes as root or as the SSH user.
      #
      # Robustness notes (learned the hard way during real upgrades):
      #  - We query ALL nodes via {.items[*]...} and take the first non-empty version
      #    instead of {.items[0]...}; a single node whose status.nodeInfo is momentarily
      #    unpopulated would otherwise yield an empty string that the `2>/dev/null || true`
      #    swallows, leaving the variable empty and failing the upgrade-path validation.
      #  - kubectl can flakily fail inside KubeKey's executor even when the cluster is
      #    healthy (env/DNS differences vs. a manual shell). To avoid a spurious
      #    "Cannot determine the running Kubernetes version", we fall back to the locally
      #    readable kube-apiserver static-pod manifest image tag (which always reflects
      #    the running control-plane version, no network needed), and finally to the
      #    on-disk kubelet binary version.
      when: .upgrade.kubernetes | default false
      run_once: true
      ignore_errors: true
      command: >-
        VER="";
        KC=/etc/kubernetes/admin.conf;
        [ -r "$KC" ] || KC=/root/.kube/config;
        [ -r "$KC" ] || KC="$HOME/.kube/config";
        if [ -r "$KC" ]; then
        VER=$(/usr/local/bin/kubectl --kubeconfig="$KC" get nodes -o jsonpath='{.items[*].status.nodeInfo.kubeletVersion}' 2>/dev/null | tr ' ' '\n' | grep -m1 '^v');
        fi;
        if [ -z "$VER" ]; then
        VER=$(sudo grep -m1 'image:' /etc/kubernetes/manifests/kube-apiserver.yaml 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1);
        fi;
        if [ -z "$VER" ]; then
        VER=$(kubelet --version 2>/dev/null | awk '{print $2}');
        fi;
        echo "$VER"
      register: kubernetes_running_version
    - name: Defaults | Share running Kubernetes version across the cluster
      when: .upgrade.kubernetes | default false
      run_once: true
      add_hostvars:
        hosts: k8s_cluster
        vars:
          kubernetes_running_version: >-
            {{ .kubernetes_running_version.stdout | default "" }}
    - name: Defaults | Get installed containerd version
      ignore_errors: true
      command: |
        containerd --version 2>/dev/null | awk '{print $3}' || true
      register: containerd_current_version
    - name: Defaults | Get installed docker version
      ignore_errors: true
      command: |
        docker version --format '{{ .Server.Version }}' 2>/dev/null || true
      register: docker_current_version

- name: Defaults | Gather ETCD service status
  when: .groups.etcd | has .inventory_hostname
  block:
    - name: Defaults | Get etcd.service LoadState and save to variable
      command: systemctl show etcd.service -p LoadState --value
      register: etcd_install_LoadState
    # TODO: etcd_install_ActiveState has no consumers anywhere in the codebase; it can be removed once confirmed unnecessary.
    - name: Defaults | Get etcd.service ActiveState and save to variable
      command: systemctl show etcd.service -p ActiveState --value
      register: etcd_install_ActiveState
    - name: Defaults | Get installed etcd version
      ignore_errors: true
      command: etcd --version
      register: etcd_install_version
      register_type: yaml

- name: Defaults | Select the initialization node for the cluster
  run_once: true
  add_hostvars:
    hosts: k8s_cluster
    vars:
      init_kubernetes_node: >-
        {{- $initNodes := list -}}
        {{- $notInitNodes := list -}}
        {{- range .groups.kube_control_plane -}}
          {{- if index $.hostvars . "kubernetes_install_LoadState" "stdout" | eq "loaded" -}}
            {{- $initNodes = append $initNodes . -}}
          {{- else if index $.hostvars . "kubernetes_install_LoadState" "stdout" | eq "not-found" -}}
            {{- $notInitNodes = append $notInitNodes . -}}
          {{- end -}}
        {{- end -}}
        {{- if $initNodes | len | eq 1 -}}
        {{ $initNodes | first }}
        {{- else if $initNodes | len | lt 1 -}}
        {{ index $initNodes (randInt 0 ((sub ($initNodes | len) 1) | int)) }}
        {{- else if $notInitNodes | len | eq 1 -}}
        {{ $notInitNodes | first }}
        {{- else if $notInitNodes | len | lt 1 -}}
        {{ index $notInitNodes (randInt 0 ((sub ($notInitNodes | len) 1) | int)) }}
        {{- end -}}
