---
- name: Package | Reset artifact directory
  command: |
    rm -rf {{ .artifact_dir }} && mkdir -p {{ .artifact_dir }}

- name: Package | Verify helm is installed when charts are configured
  when: .download.charts | empty | not
  command: |
    if ! command -v helm >/dev/null 2>&1; then
      echo "helm command not found. Downloading charts to the artifact requires the helm CLI to be installed and available on PATH. See https://helm.sh/docs/intro/install/ for installation instructions." >&2
      exit 1
    fi

- name: Package | Copy required binaries and images
  block:
    # Download core binaries
    - include_tasks: binary.yaml
    # Download Helm and CNI binaries
    - include_tasks: helm.yaml
    # Download remote images to the local images directory
    - include_tasks: images.yaml
    # Download iso file
    - include_tasks: iso.yaml
    # Download tools file
    - include_tasks: tools.yaml

- name: Package | Export artifact
  command: |
    # package binary directory
    tar -czvf {{ .artifact_dir }}/kubekey-artifact.tgz -C {{ .artifact_dir }}/kubekey . && rm -rf {{ .artifact_dir }}/kubekey
