---
- name: Cert | Generate the root CA certificate file
  tags: ["always"]
  gen_cert:
    cn: root
    date: "{{ .certs.ca.date }}"
    policy: "{{ .certs.ca.gen_cert_policy }}"
    out_key: >-
      {{ .work_dir }}/pki/root.key
    out_cert: >-
      {{ .work_dir }}/pki/root.crt

- name: Cert | Generate Kubernetes CA certificates
  block:
    - name: Cert | Generate the Kubernetes CA certificate file
      gen_cert:
        root_key: >-
          {{ .work_dir }}/pki/root.key
        root_cert: >-
          {{ .work_dir }}/pki/root.crt
        cn: kubernetes-ca
        is_ca: true
        date: "{{ .certs.kubernetes_ca.date }}"
        policy: "{{ .certs.kubernetes_ca.gen_cert_policy }}"
        out_key: >-
          {{ .work_dir }}/pki/kubernetes.key
        out_cert: >-
          {{ .work_dir }}/pki/kubernetes.crt
    - name: Cert | Generate the front-proxy CA certificate for Kubernetes
      gen_cert:
        root_key: >-
          {{ .work_dir }}/pki/root.key
        root_cert: >-
          {{ .work_dir }}/pki/root.crt
        cn: front-proxy-ca
        is_ca: true
        date: "{{ .certs.front_proxy_ca.date }}"
        policy: "{{ .certs.front_proxy_ca.gen_cert_policy }}"
        out_key: >-
          {{ .work_dir }}/pki/front-proxy.key
        out_cert: >-
          {{ .work_dir }}/pki/front-proxy.crt

- name: Cert | Generate the etcd certificate file
  loop: "{{ .groups.etcd | toJson }}"  
  when: .item | empty | not
  gen_cert:
    root_key: >-
      {{ .work_dir }}/pki/root.key
    root_cert: >-
      {{ .work_dir }}/pki/root.crt
    cn: etcd
    sans: >-
      {{- $ips := list -}}
      {{- $hostname := index .hostvars .item "hostname" | default "" -}}
      {{- if .native.set_hostname -}}
        {{- $hostname = .item -}}
      {{- end -}}
      {{- if $hostname | empty | not -}}
        {{- $ips = append $ips $hostname -}}
      {{- end -}}
      {{- $internalIPv4 := index .hostvars .item "internal_ipv4" | default "" -}}
      {{- if $internalIPv4 | empty | not -}}
        {{- $ips = append $ips $internalIPv4 -}}
      {{- end -}}
      {{- $internalIPv6 := index .hostvars .item "internal_ipv6" | default "" -}}
      {{- if $internalIPv6 | empty | not -}}
        {{- $ips = append $ips $internalIPv6 -}}
      {{- end -}}
      {{ $ips | toJson }}
    date: "{{ .certs.etcd.date }}"
    policy: "{{ .certs.etcd.gen_cert_policy }}"
    out_key: >-
      {{ .work_dir }}/pki/etcd-{{ .item }}.key
    out_cert: >-
      {{ .work_dir }}/pki/etcd-{{ .item }}.crt

- name: Cert | Generate the etcd client certificate file
  when: .groups.etcd | default list | empty | not
  gen_cert:
    root_key: >-
      {{ .work_dir }}/pki/root.key
    root_cert: >-
      {{ .work_dir }}/pki/root.crt
    cn: etcd
    date: "{{ .certs.etcd.date }}"
    policy: "{{ .certs.etcd.gen_cert_policy }}"
    out_key: >-
      {{ .work_dir }}/pki/etcd-client.key
    out_cert: >-
      {{ .work_dir }}/pki/etcd-client.crt

- name: Cert | Generate the image registry certificate file
  tags: ["image_registry"]
  gen_cert:
    root_key: >-
      {{ .work_dir }}/pki/root.key
    root_cert: >-
      {{ .work_dir }}/pki/root.crt
    cn: image_registry
    sans: >-
      {{- $ips := list -}}
      {{- if .image_registry.ha_vip | empty | not -}}
        {{- $ips = append $ips .image_registry.ha_vip -}}
      {{- end -}}
      {{- if and (.image_registry.auth.registry | empty | not) (.image_registry.auth.registry | ne "hub.kubesphere.com.cn") -}}
        {{- $ips = append $ips .image_registry.auth.registry -}}
      {{- end -}}
      {{- range .groups.image_registry | default list -}}
        {{- $internalIPv4 := index $.hostvars . "internal_ipv4" | default "" -}}
        {{- $internalIPv6 := index $.hostvars . "internal_ipv6" | default "" -}}
        {{- if $internalIPv4 | empty | not -}}
          {{- $ips = append $ips $internalIPv4 -}}
        {{- end -}}
        {{- if $internalIPv6 | empty | not -}}
          {{- $ips = append $ips $internalIPv6 -}}
        {{- end -}}
      {{- end -}}
      {{ $ips | toJson }}
    date: "{{ .certs.image_registry.date }}"
    policy: "{{ .certs.image_registry.gen_cert_policy }}"
    out_key: >-
      {{ .work_dir }}/pki/image_registry.key
    out_cert: >-
      {{ .work_dir }}/pki/image_registry.crt
  when: .groups.image_registry | default list | empty | not

- name: Cert | Generate the image registry client certificate file
  tags: ["image_registry"]
  when: .groups.image_registry | default list | empty | not
  gen_cert:
    root_key: >-
      {{ .work_dir }}/pki/root.key
    root_cert: >-
      {{ .work_dir }}/pki/root.crt
    cn: image-registry-client
    date: "{{ .certs.image_registry.date }}"
    policy: "{{ .certs.image_registry.gen_cert_policy }}"
    out_key: >-
      {{ .work_dir }}/pki/image-registry-client.key
    out_cert: >-
      {{ .work_dir }}/pki/image-registry-client.crt

# Harbor signs the registry Bearer tokens with <data_volume>/secret/core/private_key.pem
# and verifies them with <data_volume>/secret/registry/root.crt; the core/jobservice
# shared secret and the CSRF key are derived from the 16 byte <data_volume>/secret/keys/secretkey.
# "prepare" creates all three independently on every instance, so an instance only accepts
# the tokens it issued itself. In an HA deployment that breaks every request which is issued
# by one instance and presented to another: the harbor nodes reject each other with 401,
# which the create-registries step surfaces as HTTP 400 "the registry is unhealthy", and a
# client that keeps using a token issued before a VIP failover is rejected by the instance
# that took the VIP over. Harbor's HA guide requires all instances to share the same material,
# so it is generated once on the controller and pre-placed by roles/image-registry/harbor
# before prepare runs. IfNotPresent never re-keys a cluster that is already deployed.
- name: Cert | Generate the shareable Harbor token signing key pair
  tags: ["image_registry"]
  when:
    - .image_registry.type | eq "harbor"
    - .groups.image_registry | default list | empty | not
  gen_cert:
    cn: harbor-token
    is_ca: true
    date: "{{ .certs.image_registry.date }}"
    policy: "{{ .certs.image_registry.gen_cert_policy }}"
    out_key: >-
      {{ .work_dir }}/pki/harbor-token.key
    out_cert: >-
      {{ .work_dir }}/pki/harbor-token.crt

- name: Cert | Generate the shareable Harbor secret key
  tags: ["image_registry"]
  when:
    - .image_registry.type | eq "harbor"
    - .groups.image_registry | default list | empty | not
  command: |
    if [ ! -s {{ .work_dir }}/pki/harbor-secretkey ]; then
      head -c 16 /dev/urandom > {{ .work_dir }}/pki/harbor-secretkey
      chmod 600 {{ .work_dir }}/pki/harbor-secretkey
    fi

- name: Cert | Set ownership of the PKI directory to the sudo user
  block:
    - name: Cert | Change ownership of the PKI directory to the sudo user
      ignore_errors: true
      command: |
        chown -R ${SUDO_UID}:${SUDO_GID} {{ .work_dir }}/pki
