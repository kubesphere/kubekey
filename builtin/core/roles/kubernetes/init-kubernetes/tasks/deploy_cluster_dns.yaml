---
- name: DNS | Generate CoreDNS configuration file
  template:
    src: dns/coredns.yaml
    dest: /etc/kubernetes/coredns.yaml

# Update the clusterIP for the service and modify the CoreDNS ConfigMap as needed
- name: DNS | Apply CoreDNS configuration and restart deployment
  command: |
    kubectl delete svc kube-dns -n kube-system
    kubectl apply -f /etc/kubernetes/coredns.yaml && kubectl rollout restart deployment -n kube-system coredns

# The CoreDNS Deployment is generated by kubeadm with config-volume items limited
# to the Corefile key. When the ConfigMap carries a hosts key (user-configured
# dns_etc_hosts or auto-injected registry/NFS entries), mount it into the pod as
# well so the hosts plugin can read /etc/coredns/hosts.
- name: DNS | Mount hosts file into CoreDNS deployment
  command: |
    if kubectl get configmap coredns -n kube-system -o jsonpath='{.data.hosts}' | grep -q .; then
      kubectl patch deployment coredns -n kube-system --type=strategic -p='{"spec":{"template":{"spec":{"volumes":[{"name":"config-volume","configMap":{"items":[{"key":"Corefile","path":"Corefile"},{"key":"hosts","path":"hosts"}]}}]}}}}'
    fi

- name: DNS | Generate NodeLocalDNS DaemonSet manifest
  when: .dns.nodelocaldns.enabled
  template:
    src: dns/nodelocaldns.yaml
    dest: /etc/kubernetes/nodelocaldns.yaml

- name: DNS | Deploy NodeLocalDNS DaemonSet
  when: .dns.nodelocaldns.enabled
  command: |
    kubectl apply -f /etc/kubernetes/nodelocaldns.yaml
