# K3s configuration file
# This file is generated by KubeKey for k3s installation

# Disable k3s built-in components that we want to manage separately
disable:
  - traefik
  - servicelb
  {{- if .kubernetes.kube_proxy.enabled | not }}
  - kube-proxy
  {{- end }}

# Cluster configuration
cluster-init: true
{{- if .kubernetes.control_plane_endpoint.type | eq "local" }}
server: https://127.0.0.1:6443
{{- else }}
server: https://{{ .kubernetes.control_plane_endpoint.host }}:{{ .kubernetes.control_plane_endpoint.port }}
{{- end }}

# Networking configuration
# Disable k3s built-in networking since we'll install Calico
flannel-backend: none
disable-network-policy: true

# Node configuration
node-name: {{ .hostname }}
{{- if .kubernetes.kubelet.max_pod }}
kubelet-arg:
  - max-pods={{ .kubernetes.kubelet.max_pod }}
{{- end }}

# Data directory
data-dir: /var/lib/rancher/k3s

# TLS configuration
{{- if .kubernetes.certs.ca_cert | empty | not }}
tls-san:
  - {{ .kubernetes.control_plane_endpoint.host }}
{{- end }}

# Write kubeconfig to a standard location
write-kubeconfig: /etc/rancher/k3s/k3s.yaml
write-kubeconfig-mode: 600
