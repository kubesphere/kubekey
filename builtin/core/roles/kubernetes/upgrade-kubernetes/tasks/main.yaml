---
- name: UpgradeKubernetes | Backup Kubernetes configurations and binaries before upgrade
  command: |
    BACKUP_DIR="/etc/kubekey/backup/kubernetes/$(date +%Y%m%d-%H%M%S)"
    mkdir -p "${BACKUP_DIR}"
    cp /etc/kubernetes/kubeadm-config.yaml "${BACKUP_DIR}/" 2>/dev/null || true
    cp /usr/local/bin/kubeadm "${BACKUP_DIR}/" 2>/dev/null || true
    cp /usr/local/bin/kubelet "${BACKUP_DIR}/" 2>/dev/null || true
    cp /usr/local/bin/kubectl "${BACKUP_DIR}/" 2>/dev/null || true
    echo "✅ Kubernetes backup saved to ${BACKUP_DIR}"

# kubeadm `upgrade apply` keeps a pre-existing, user-customized CoreDNS ConfigMap
# (it only migrates non-default Corefiles, backing the old one up inside the
# same ConfigMap as `Corefile-backup`), but it unconditionally overwrites a
# DEFAULT Corefile with the new version's template. Either way the original
# Corefile can change or move after the jump, so snapshot it before upgrading so
# a customized configuration is never silently lost and can be reconciled from
# the backup afterwards.
- name: UpgradeKubernetes | Backup CoreDNS configuration before upgrade
  when:
    - .groups.kube_control_plane | default list | has .inventory_hostname
    - .init_kubernetes_node | eq .inventory_hostname
  command: |
    BACKUP_DIR="/etc/kubekey/backup/kubernetes/$(date +%Y%m%d-%H%M%S)"
    mkdir -p "${BACKUP_DIR}"
    KC=/etc/kubernetes/admin.conf
    [ -r "$KC" ] || KC=/root/.kube/config
    [ -r "$KC" ] || KC="$HOME/.kube/config"
    /usr/local/bin/kubectl --kubeconfig="$KC" -n kube-system get cm coredns -o yaml > "${BACKUP_DIR}/coredns-configmap.yaml" 2>/dev/null || true
    echo "✅ CoreDNS ConfigMap backup saved to ${BACKUP_DIR}/coredns-configmap.yaml"

- name: UpgradeKubernetes | Ensure kubeadm configuration exists locally on control plane
  when: .groups.kube_control_plane | default list | has .inventory_hostname
  command: |
    mkdir -p /etc/kubernetes
    # Keep /etc/kubernetes/kubeadm-config.yaml in sync with the cluster's kubeadm-config
    # ConfigMap (consumed by kubeadm < v1.30 as --config, and by the backup task above).
    #
    # This MUST re-sync the local file on every upgrade hop, not only when it is absent:
    # kubeadm `upgrade apply` updates the live kubeadm-config ConfigMap to the new version
    # but does NOT rewrite this on-disk copy. In the auto-step flow each hop runs
    # `kubeadm upgrade apply` with --config=<this file> (kubeadm < v1.30), so a stale
    # local kubernetesVersion (e.g. still v1.23.17 after the hop to v1.24.17) makes the
    # next kubeadm (v1.25+) reject the upgrade ("this version of kubeadm only supports
    # deploying clusters with control plane version >= 1.24.0. Current version: v1.23.17").
    # The ConfigMap is the per-hop source of truth (kubeadm keeps it current), so mirror it.
    #
    # No other surgery is needed: the etcd section and nodeRegistration are UNCHANGED
    # across an upgrade (KubeKey writes etcd.external into the ClusterConfiguration at init
    # time, and the CRI endpoint is injected via kubeadm-flags.env, not this file).
    #
    # A healthy local copy is still never clobbered by an empty/degraded fetch: we only
    # write when the live ClusterConfiguration is non-empty.
    KC=/etc/kubernetes/admin.conf
    [ -r "$KC" ] || KC=/root/.kube/config
    [ -r "$KC" ] || KC="$HOME/.kube/config"
    CUR=$(kubectl --kubeconfig="$KC" get cm kubeadm-config -n kube-system -o=jsonpath='{.data.ClusterConfiguration}' 2>/dev/null)
    if [ -n "$CUR" ] && printf '%s' "$CUR" | grep -q 'ClusterConfiguration'; then
      printf '%s\n' "$CUR" > /etc/kubernetes/kubeadm-config.yaml
    fi

- name: UpgradeKubernetes | Regenerate kubelet kubeadm-flags.env with the configured CRI endpoint
  when: .cri.cri_socket | default "" | ne ""
  command: |
    # kubeadm upgrade does NOT rewrite /var/lib/kubelet/kubeadm-flags.env, so the flags
    # written at create time persist and lack the explicit CRI endpoint that newer kubelet
    # requires (the dockershim default was dropped in v1.24). Rewrite with the configured
    # endpoint so the bumped kubelet starts, and so kubeadm v1.30+ `upgrade apply` reads
    # the pinned CRI endpoint from this file instead of auto-detecting. The pod infra image
    # is deliberately NOT set here: that is the container runtime's responsibility.
    mkdir -p /var/lib/kubelet
    printf 'KUBELET_KUBEADM_ARGS="--container-runtime-endpoint={{ .cri.cri_socket }}"\n' > /var/lib/kubelet/kubeadm-flags.env
    echo "✅ kubeadm-flags.env -> --container-runtime-endpoint={{ .cri.cri_socket }}"

- name: UpgradeKubernetes | Upgrade Kubernetes cluster on first control plane node
  when:
    - .groups.kube_control_plane | default list | has .inventory_hostname
    - .init_kubernetes_node | eq .inventory_hostname
  command: |
    # kubeadm v1.30+ rejects `--config` files that carry an InitConfiguration /
    # ClusterConfiguration document for `upgrade apply`: it now requires an
    # UpgradeConfiguration, which is only registered from v1.31+. Passing the
    # legacy two-document config fails with
    #   "no UpgradeConfiguration found in the supplied config".
    # For v1.30+ we therefore drop `--config` entirely; kubeadm then reads the
    # ClusterConfiguration from the live kubeadm-config ConfigMap and the CRI
    # socket from /var/lib/kubelet/kubeadm-flags.env (written by the task above).
    # For < v1.30 the `--config` (the on-disk kubeadm-config.yaml, which still
    # carries its original nodeRegistration) is used; those kubeadm versions
    # auto-detect the CRI and only abort with "Found multiple CRI endpoints"
    # whenever both containerd.sock and cri-dockerd.sock exist.
    # Idempotency guard: if the kubeadm-config ConfigMap already records a version
    # >= the target, the previous upgrade step already applied this minor (e.g. the
    # cluster was left partially upgraded with some nodes still lagging). Re-running
    # `kubeadm upgrade apply` would fail ("version already at target"), so skip it;
    # the lagging nodes are caught up by `kubeadm upgrade node` below. This is what
    # makes a half-upgraded cluster resumable without ever producing a >1 minor skew.
    KC=/etc/kubernetes/admin.conf
    [ -r "$KC" ] || KC=/root/.kube/config
    [ -r "$KC" ] || KC="$HOME/.kube/config"
    CUR=$(/usr/local/bin/kubectl --kubeconfig="$KC" -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' 2>/dev/null | grep -m1 '^kubernetesVersion:' | awk '{print $2}')
    TGT="{{ .kubernetes.kube_version }}"
    if [ -n "$CUR" ] && [ "$(printf '%s\n%s\n' "$CUR" "$TGT" | sort -V | tail -1)" = "$CUR" ]; then
      echo "✅ kubeadm-config already at ${CUR} (>= target ${TGT}); skipping upgrade apply"
      exit 0
    fi
    MINOR=$(echo "{{ .kubernetes.kube_version }}" | sed -E 's/^v?[0-9]+\.([0-9]+)\..*/\1/')
    CONFIG=/etc/kubernetes/kubeadm-config.yaml
    CRI="{{ .cri.cri_socket | default "" }}"
    if [ "${MINOR:-0}" -ge 30 ] 2>/dev/null; then
      CONFIG_ARG=""
    else
      # kubeadm < v1.30 reads the CRI endpoint from --config's
      # InitConfiguration.nodeRegistration.criSocket. The on-disk file is rewritten
      # per hop as a ClusterConfiguration-only document (see the re-sync task above),
      # so without an explicit socket kubeadm auto-detects the endpoint and aborts
      # with "Found multiple CRI endpoints" whenever both containerd.sock and
      # cri-dockerd.sock coexist (docker + Kubernetes >= v1.24). Pin the configured
      # endpoint by appending a v1beta3 InitConfiguration document (only criSocket,
      # no name / localAPIEndpoint) so kubeadm uses it directly instead of probing.
      # Run every hop, AFTER the re-sync task, because that task overwrites the file.
      if [ -n "$CRI" ] && [ -f "$CONFIG" ]; then
        # The on-disk kubeadm-config.yaml may already carry an InitConfiguration
        # document from create time (and the re-sync task above cannot always
        # overwrite it, e.g. when admin.conf is root-only). Blindly appending
        # another one makes kubeadm reject the file with
        #   'kind "InitConfiguration" is specified twice in YAML file'
        # so drop any pre-existing document and keep only the leading
        # ClusterConfiguration before appending the pinned init.
        awk '/^---[[:space:]]*$/ { exit } { print }' "$CONFIG" > "${CONFIG}.kk" && mv "${CONFIG}.kk" "$CONFIG"
        printf '\n---\napiVersion: kubeadm.k8s.io/v1beta3\nkind: InitConfiguration\nnodeRegistration:\n  criSocket: "%s"\n' "$CRI" >> "$CONFIG"
        echo "✅ config criSocket -> $CRI"
      fi
      CONFIG_ARG="--config=$CONFIG"
    fi
    # `kubeadm upgrade apply` runs a battery of preflight checks whose strictness
    # grows with every Kubernetes minor. Several are harmless for a cluster that is
    # already running and that KubeKey has already validated in its own precheck
    # phase, yet they abort the whole upgrade in this environment:
    #   - CoreDNSUnsupportedPlugins / CoreDNSMigration (added in v1.31): perform a
    #     SelfSubjectAccessReview against the admin kubeconfig; KubeKey-issued admin
    #     certs use the non-default org "kubeadm:cluster-admins" (vanilla kubeadm uses
    #     "system:masters"), so these *advisory* checks report "configmaps coredns is
    #     forbidden" even though the cert is cluster-admin.
    #   - CreateJob (added in v1.32): spins up an upgrade-health-check Job and fails
    #     if it does not complete within 15s; under node pressure during the upgrade
    #     this false-positives.
    # Because KubeKey runs its own thorough precheck (os/network/kubernetes/etcd/cni)
    # before reaching this task, it is safe to let `upgrade apply` skip every preflight
    # here via the documented "all" escape hatch rather than chase each new check.
    # kube-apiserver restarts when this hop switches the control plane to the
    # target minor (or when the kubelet pulls the bumped control-plane binaries).
    # `kubeadm upgrade apply` reads the kubeadm-config ConfigMap; if a fresh
    # apiserver has not yet loaded its RBAC policy it transiently rejects the read
    # with
    #   configmaps "kubeadm-config" is forbidden: User "kubernetes-admin" ...
    # failing the whole hop. So wait until the CM is readable with the admin
    # kubeconfig both before apply and again before each RBAC-window retry.
    wait_apiserver() {
      i=1
      while [ $i -le 12 ]; do
        if /usr/local/bin/kubectl --kubeconfig="$KC" -n kube-system get cm kubeadm-config >/dev/null 2>&1; then
          return 0
        fi
        i=$((i+1))
        sleep 5
      done
      return 1
    }
    if ! wait_apiserver; then
      echo "❌ kube-apiserver not ready to serve kubeadm-config within 60s"
      exit 1
    fi
    # apply, wrapping only the RBAC read-window failure with a bounded retry; any
    # other failure surfaces immediately.
    APPTRIES=3
    n=0
    while :; do
      OUT=$(/usr/local/bin/kubeadm upgrade apply {{ .kubernetes.kube_version }} ${CONFIG_ARG} --yes --ignore-preflight-errors=all 2>&1)
      RC=$?
      if [ $RC -eq 0 ]; then
        echo "✅ kubeadm upgrade apply to {{ .kubernetes.kube_version }} succeeded"
        break
      fi
      if ! printf '%s' "$OUT" | grep -qiE "forbidden|cannot get resource .configmaps|failed to get config map"; then
        printf '%s\n' "$OUT"
        exit $RC
      fi
      n=$((n+1))
      if [ $n -ge $APPTRIES ]; then
        printf '%s\n' "$OUT"
        echo "❌ kubeadm upgrade apply failed $APPTRIES times (RBAC read window); giving up"
        exit $RC
      fi
      echo "⚠️  kubeadm upgrade apply hit the RBAC read window (attempt $n); waiting for apiserver readiness, retrying"
      wait_apiserver
    done

# kubeadm `upgrade apply` rewrites a default CoreDNS Corefile to the new version's
# template (e.g. the `cache 30 { disable success ... }` block introduced in newer
# minors), but it does NOT bump the coredns image on the Deployment. If the old
# kube-coredns binary does not understand the new Corefile plugins it stays in
# CrashLoopBackOff, so the whole cluster-becomes-DNS-dead right after a successful
# Kubernetes-only bump. Align the Deployment image to the target minor's pinned
# CoreDNS tag. The configured image PREFIX is retained (only the `:tag` changes) so
# offline / mirrored registries keep working; the tag comes from this version's
# dns.coredns.image.tag default and matches what kubeadm expects for the new minor.
- name: UpgradeKubernetes | Align CoreDNS image with the target Kubernetes version
  when:
    - .groups.kube_control_plane | default list | has .inventory_hostname
    - .init_kubernetes_node | eq .inventory_hostname
  command: |
    set -u
    # Locate a readable kubeconfig: the root-owned admin.conf first, then the
    # common fallbacks. kk runs tasks as root, but be defensive about $HOME.
    KC=""
    for p in /etc/kubernetes/admin.conf /root/.kube/config "$HOME/.kube/config"; do
      if [ -r "$p" ]; then KC="$p"; break; fi
    done
    K="$(command -v kubectl || true)"; [ -x "$K" ] || K=/usr/local/bin/kubectl
    TARGET="{{ .dns.coredns.image.tag }}"
    [ -n "$TARGET" ] || exit 0
    # kubeadm upgrade apply just restarted the control plane, so wait for the
    # apiserver to be ready before touching CoreDNS. Without this the read below
    # hits the brief RBAC/read window and the whole align is skipped, leaving
    # CoreDNS pinned to the old (baseline) tag across a multi-hop upgrade.
    for _ in $(seq 1 40); do
      if "$K" ${KC:+"--kubeconfig=$KC"} get --raw=/healthz 2>/dev/null | grep -q ok; then break; fi
      sleep 3
    done
    # In the auto-step flow every hop pins .dns.coredns.image.tag to the CURRENT minor's
    # tag (see the upgradeVersionFieldPaths allow-list in builtin/core/upgrade_path.go), so
    # we align straight to it and no longer query `kubeadm config images list`. The registry
    # PREFIX of the running image is kept; only the `:tag` is replaced, so mirrored /
    # offline registries keep working.
    CUR=""
    for _ in $(seq 1 10); do
      CUR=$("$K" ${KC:+"--kubeconfig=$KC"} -n kube-system get deploy coredns -o jsonpath='{.spec.template.spec.containers[?(@.name=="coredns")].image}' 2>/dev/null)
      [ -n "$CUR" ] && break
      sleep 3
    done
    [ -n "$CUR" ] || exit 0
    IMG="${CUR%:*}:${TARGET}"
    "$K" ${KC:+"--kubeconfig=$KC"} -n kube-system set image deploy/coredns coredns="$IMG" >/dev/null
    "$K" ${KC:+"--kubeconfig=$KC"} -n kube-system rollout status deploy/coredns --timeout=180s >/dev/null
    # kubeadm `upgrade apply` re-applies the CoreDNS addon from the kubeadm-config
    # ClusterConfiguration's `dns.imageTag` on EVERY hop -- including the worker-play
    # apply, whose (delayed) CoreDNS reconcile runs AFTER this align. If that tag is
    # still pinned to the baseline version the next apply reverts CoreDNS right back
    # to it, which is exactly the multi-hop "CoreDNS stuck at the start minor" bug.
    # Keep kubeadm's view in sync: patch the live ConfigMap (kubeadm v1.30+ source of
    # truth) and the on-disk file (kubeadm < v1.30 reads it via --config).
    patch_kubeadm_dns_tag() {
      local f="$1"
      [ -s "$f" ] || return 0
      awk -v tag="$TARGET" '
        /^dns:/ { indns=1 }
        indns && /^  imageTag:/ { print "  imageTag: " tag; next }
        indns && /^[^ ]/ && !/^dns:/ { indns=0 }
        { print }
      ' "$f" > "$f.kk" && mv "$f.kk" "$f"
    }
    CFGCM="$(mktemp /tmp/kk-kubeadm-config.XXXXXX.yaml)"
    if "$K" ${KC:+"--kubeconfig=$KC"} -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' > "$CFGCM" 2>/dev/null && [ -s "$CFGCM" ]; then
      patch_kubeadm_dns_tag "$CFGCM"
      "$K" ${KC:+"--kubeconfig=$KC"} -n kube-system create cm kubeadm-config --from-file=ClusterConfiguration="$CFGCM" --dry-run=client -o yaml 2>/dev/null | "$K" ${KC:+"--kubeconfig=$KC"} apply -f - >/dev/null 2>&1
    fi
    rm -f "$CFGCM"
    if [ -f /etc/kubernetes/kubeadm-config.yaml ]; then
      patch_kubeadm_dns_tag /etc/kubernetes/kubeadm-config.yaml
    fi
    echo "CoreDNS image -> ${IMG}"

# NodeLocalDNS (k8s-dns-node-cache) is a node-local forwarding cache whose config
# is compatible across Kubernetes minors and which kubeadm NEVER manages/migrates.
# Unlike CoreDNS (whose kube-coredns binary cannot parse a newer Corefile), there
# is no crash risk from an older node-cache image. The per-hop config pins
# .dns.nodelocaldns.image.tag to the current minor, so this task idempotently
# aligns the DaemonSet to it on every hop (node-cache is forward compatible, so it
# is safe to bump per hop). The running image's registry PREFIX is kept; only the
# `:tag` is replaced.
- name: UpgradeKubernetes | Align NodeLocalDNS image to the final target version
  when:
    - .groups.kube_control_plane | default list | has .inventory_hostname
    - .init_kubernetes_node | eq .inventory_hostname
    - .dns.nodelocaldns.enabled | default false
    - .dns.nodelocaldns.image.tag | default "" | ne ""
  command: |
    KC=/etc/kubernetes/admin.conf
    [ -r "$KC" ] || KC=/root/.kube/config
    [ -r "$KC" ] || KC="$HOME/.kube/config"
    K=/usr/local/bin/kubectl
    TAG="{{ .dns.nodelocaldns.image.tag }}"
    CUR=$($K --kubeconfig="$KC" -n kube-system get ds nodelocaldns -o jsonpath='{.spec.template.spec.containers[?(@.name=="node-cache")].image}' 2>/dev/null)
    if [ -z "$CUR" ]; then
      echo "ℹ️  NodeLocalDNS DaemonSet not found; nothing to align"
      exit 0
    fi
    IMG="${CUR%:*}:${TAG}"
    if [ "$CUR" != "$IMG" ]; then
      $K --kubeconfig="$KC" -n kube-system set image ds/nodelocaldns node-cache="$IMG" >/dev/null
      $K --kubeconfig="$KC" -n kube-system rollout status ds/nodelocaldns --timeout=180s >/dev/null
    fi
    echo "✅ NodeLocalDNS image -> ${IMG}"

# The containerd role only re-renders /etc/containerd/config.toml when the
# containerd VERSION changes (or config_policy is set). A plain Kubernetes minor
# bump therefore leaves sandbox_image (the pause image) pinned to the baseline tag,
# so new pod sandboxes keep using the old pause. Align it per hop from the per-hop
# .kubernetes.sandbox_image.tag overlay and restart containerd. Runs on every node
# because config.toml is node-local. Idempotent: skip the restart when already aligned.
- name: UpgradeKubernetes | Align pause (sandbox_image) with the target Kubernetes version
  when:
    - .kubernetes.sandbox_image.tag | default "" | ne ""
  command: |
    set -u
    TARGET="{{ .kubernetes.sandbox_image.tag }}"
    IMG="{{ .kubernetes.sandbox_image.registry }}/{{ .kubernetes.sandbox_image.repository }}:${TARGET}"
    CFG=/etc/containerd/config.toml
    [ -f "$CFG" ] || { echo "no containerd config at $CFG; skip"; exit 0; }
    if grep -q "sandbox_image[[:space:]]*=[[:space:]]*\"${IMG}\"" "$CFG"; then
      echo "sandbox_image already ${IMG}; skip"
      exit 0
    fi
    sed -i "s#sandbox_image[[:space:]]*=[[:space:]]*\"[^\"]*\"#sandbox_image = \"${IMG}\"#g" "$CFG"
    systemctl daemon-reload && systemctl restart containerd.service
    echo "pause sandbox_image -> ${IMG}"

- name: UpgradeKubernetes | Upgrade node configuration on other control plane nodes
  when:
    - .groups.kube_control_plane | default list | has .inventory_hostname
    - .init_kubernetes_node | eq .inventory_hostname | not
  command: |
    /usr/local/bin/kubeadm upgrade node --ignore-preflight-errors=ImagePull

- name: UpgradeKubernetes | Upgrade node configuration on worker nodes
  when: .groups.kube_worker | default list | has .inventory_hostname
  command: |
    /usr/local/bin/kubeadm upgrade node --ignore-preflight-errors=ImagePull

- name: UpgradeKubernetes | Restart kubelet service after upgrade
  command: |
    systemctl daemon-reload && systemctl restart kubelet.service

- name: UpgradeKubernetes | Wait for kubelet to be ready after restart
  command: |
    i=1
    while [ $i -le 30 ]; do
      if systemctl is-active kubelet.service >/dev/null 2>&1; then
        echo "✅ kubelet is active"
        exit 0
      fi
      i=$((i+1))
      sleep 5
    done
    echo "❌ kubelet is not active within 150 seconds"
    exit 1
