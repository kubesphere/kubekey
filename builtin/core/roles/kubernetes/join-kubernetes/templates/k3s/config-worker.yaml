# K3s worker configuration file
# This file is generated by KubeKey for k3s worker node installation

# Connect to the k3s server
server: https://{{ .init_kubernetes_node }}:6443

# Node configuration
node-name: {{ .hostname }}
{{- if .kubernetes.kubelet.max_pod }}
kubelet-arg:
  - max-pods={{ .kubernetes.kubelet.max_pod }}
{{- end }}

# Data directory
data-dir: /var/lib/rancher/k3s

# Token for joining the cluster (will be set by KubeKey)
token: "{{ .k3s_token }}"
