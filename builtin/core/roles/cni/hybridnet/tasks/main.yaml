---
- name: Hybridnet | Synchronize Hybridnet Helm chart package to remote node
  copy:
    src: >-
      {{ .binary_dir }}/cni/hybridnet-{{ .cni.hybridnet_version }}.tgz
    dest: >-
      /etc/kubernetes/cni/hybridnet-{{ .cni.hybridnet_version }}.tgz

- name: Hybridnet | Generate Hybridnet custom values file
  when: .cni.hybridnet.values | empty | not
  copy:
    content: |
      {{ .cni.hybridnet.values }}
    dest: /etc/kubernetes/cni/hybridnet-custom-values.yaml

- name: Hybridnet | Generate default values file for Hybridnet
  template:
    src: values.yaml
    dest: /etc/kubernetes/cni/hybridnet-default-values.yaml

# Reference: https://artifacthub.io/packages/helm/hybridnet/hybridnet
- name: Hybridnet | Install Hybridnet using Helm
  command: |
    helm upgrade --install --reuse-values --namespace kube-system hybridnet /etc/kubernetes/cni/hybridnet-{{ .cni.hybridnet_version }}.tgz -f /etc/kubernetes/cni/hybridnet-default-values.yaml {{ if .cni.hybridnet.values | empty | not }}-f /etc/kubernetes/cni/hybridnet-custom-values.yaml{{ end }}

# A dual-stack pod gets one IPv4 and one IPv6 address, both from Subnets of the
# same Network, so the "init" Network needs one Subnet per family. The chart only
# renders the IPv4 one, so create its IPv6 counterpart here.
- name: Hybridnet | Add the IPv6 Subnet of the "init" overlay Network for a dual-stack cluster
  when: and (eq (.cni.pod_cidr | splitList "," | first | ipFamily) "IPv4") (eq (.cni.pod_cidr | splitList "," | last | ipFamily) "IPv6")
  block:
    - name: Hybridnet | Generate the IPv6 Subnet manifest
      template:
        src: init-ipv6-subnet.yaml
        dest: /etc/kubernetes/cni/hybridnet-init-ipv6-subnet.yaml

    # Subnets are served by a webhook whose failurePolicy is "Fail", so the
    # apply is retried until the webhook Pods are reachable.
    - name: Hybridnet | Create the IPv6 Subnet
      command: |
        i=0
        while [ "$i" -lt 60 ]; do
          if kubectl apply -f /etc/kubernetes/cni/hybridnet-init-ipv6-subnet.yaml; then
            exit 0
          fi
          i=$((i+1))
          sleep 5
        done
        echo 'failed to create the IPv6 Subnet of the "init" overlay Network' >&2
        exit 1
