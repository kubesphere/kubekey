---
- name: Calico | Check if calicoctl is installed
  ignore_errors: true
  command: calicoctl version
  register: calicoctl_install_version
  register_type: yaml

- name: Calico | Install calicoctl if it is not present
  when: .calicoctl_install_version.error | empty | not
  block:
    - name: Calico | Copy calicoctl binary to remote node
      copy:
        src: >-
          {{ .binary_dir }}/cni/calico/{{ .cni.calico_version }}/{{ .binary_type }}/calicoctl-linux-{{ .binary_type }}
        dest: /usr/local/bin/calicoctl
        mode: 0755

- name: Calico | Copy Calico Helm package to remote node
  copy:
    src: >-
      {{ .binary_dir }}/cni/calico/tigera-operator-{{ .cni.calico_version }}.tgz
    dest: >-
      /etc/kubernetes/cni/tigera-operator-{{ .cni.calico_version }}.tgz

- name: Calico | Generate custom values file for Calico
  when: .cni.calico.values | empty | not
  copy:
    content: |
      {{ .cni.calico.values }}
    dest: /etc/kubernetes/cni/calico-custom-values.yaml

- name: Calico | Generate default values file for Calico
  template:
    src: values.yaml
    dest: /etc/kubernetes/cni/calico-default-values.yaml

# Helm only installs CRDs from a chart's crds/ directory on the *install* path.
# When upgrading an existing release (e.g. v3.25.2 -> v3.31.3), the upgrade path
# skips crds/, so newly introduced CRDs (Goldmane/Whisker in operator.tigera.io/v1)
# are never registered and `helm upgrade` fails with "no matches for kind ...".
# Apply the chart's CRDs explicitly (matching Calico's documented upgrade flow)
# before the operator upgrade so the new kinds exist when Helm applies them.
- name: Calico | Apply Calico CRDs before Helm upgrade (Helm skips new CRDs on upgrade)
  when: .upgrade.cni | default false
  command: |
    rm -rf /etc/kubernetes/cni/calico-crds-{{ .cni.calico_version }}
    mkdir -p /etc/kubernetes/cni/calico-crds-{{ .cni.calico_version }}
    tar xzf /etc/kubernetes/cni/tigera-operator-{{ .cni.calico_version }}.tgz -C /etc/kubernetes/cni/calico-crds-{{ .cni.calico_version }}
    kubectl apply -f /etc/kubernetes/cni/calico-crds-{{ .cni.calico_version }}/tigera-operator/crds/

- name: Calico | Deploy Calico using Helm
  command: |
    helm upgrade --install --create-namespace --namespace tigera-operator calico /etc/kubernetes/cni/tigera-operator-{{ .cni.calico_version }}.tgz -f /etc/kubernetes/cni/calico-default-values.yaml {{ if .cni.calico.values | empty | not }}-f /etc/kubernetes/cni/calico-custom-values.yaml{{ end }} 
