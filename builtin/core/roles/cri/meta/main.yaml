dependencies:
  - role: cri/crictl

  - role: cri/docker
    when: .cri.container_manager | eq "docker"

  - role: cri/containerd
    when: .cri.container_manager | eq "containerd"

  # cri-dockerd is only relevant for docker runtimes on Kubernetes >= v1.24.0
  # (dockershim removal). It is also referenced directly in upgrade_cluster.yaml
  # for Kubernetes-only upgrades, so it must remain a standalone role.
  - role: cri/cridockerd
    when: .cri.container_manager | eq "docker"