{{- $config := .cri.containerd.config }}
{{- $_ := set $config "root" (.cri.containerd.data_root | default "/var/lib/containerd") }}

{{- /* containerd v2 dropped the "tls" field of registry.configs.<host> (it is rejected as an
       unknown key) and refuses to combine registry.mirrors with registry.config_path, so a v2
       node has to read its registry settings from /etc/containerd/certs.d/<host>/hosts.toml,
       which this role writes for every configured registry (see tasks/main.yaml). The
       credentials stay in registry.configs because containerd keeps honouring
       configs.<host>.auth when config_path is set. v1 nodes keep the mirrors/configs layout.

       config_path must stay a SINGLE directory. The CRI pull path that containerd v2 uses by
       default is the transfer service: it hands the whole config_path value to
       config.HostDirFromRoot() without splitting it on the list separator
       (internal/cri/server/images/image_pull.go passes it to registry.WithHostDir(), which
       reaches core/transfer/registry/registry.go). A colon separated value such as
       "/etc/containerd/certs.d:/etc/docker/certs.d" therefore resolves to a directory that
       never exists, and ConfigureHosts (core/remotes/docker/config/hosts.go) reads the resulting
       ErrNotFound as "no host configuration": it silently degrades to a single default host and
       contacts the upstream registry directly, without logging any error or warning. The
       alternative pull path (use_local_image_pull = true) does call filepath.SplitList, and CRI
       switches to it on its own whenever registry.configs or another local-pull-only option is
       set, which is why a colon separated value can look like it works. Reported upstream as
       containerd#12808, fix proposed in containerd#12829 (still open). */}}
{{- $containerdV2 := .cri.containerd_version | default "" | hasPrefix "v2." }}

{{- $mirrors := dict }}
{{- if not $containerdV2 }}
{{- if .cri.registry.mirrors | empty | not }}
{{- $_ := set $mirrors "docker.io" (dict "endpoint" .cri.registry.mirrors) }}
{{- end }}
{{- range .cri.registry.insecure_registries }}
{{- $_ := set $mirrors . (dict "endpoint" (list (printf "http://%s" .))) }}
{{- end }}
{{- end }}

{{- $configs := dict }}
{{- if and (.image_registry.auth.registry | empty | not) (ne (.image_registry.auth.registry | splitList "/" | first) "hub.kubesphere.com.cn") }}
  {{- $registry_parts := .image_registry.auth.registry | splitList "/" | first }}
  {{- if and (not $containerdV2) (.image_registry.auth.plain_http | default false) }}
  {{- $plainScheme := "http" }}
  {{- $_ := set $mirrors $registry_parts (dict "endpoint" (list (printf "%s://%s" $plainScheme $registry_parts))) }}
  {{- end }}
  {{- $skip_tls := true }}
  {{- if hasKey .image_registry.auth "skip_tls_verify" }}
  {{- $skip_tls = .image_registry.auth.skip_tls_verify | toBool }}
  {{- end }}
  {{- $auth := dict "username" .image_registry.auth.username "password" .image_registry.auth.password }}
  {{- $registryConfig := dict "auth" $auth }}
  {{- if not $containerdV2 }}
  {{- $tls := dict "insecure_skip_verify" $skip_tls }}
  {{- if printf "/etc/containerd/certs.d/%s/ca.crt" $registry_parts | fileExists }}
  {{- $_ := set $tls "ca_file" (printf "/etc/containerd/certs.d/%s/ca.crt" $registry_parts) }}
  {{- end }}
  {{- if printf "/etc/containerd/certs.d/%s/client.crt" $registry_parts | fileExists }}
  {{- $_ := set $tls "cert_file" (printf "/etc/containerd/certs.d/%s/client.crt" $registry_parts) }}
  {{- end }}
  {{- if printf "/etc/containerd/certs.d/%s/client.key" $registry_parts | fileExists }}
  {{- $_ := set $tls "key_file" (printf "/etc/containerd/certs.d/%s/client.key" $registry_parts) }}
  {{- end }}
  {{- $_ := set $registryConfig "tls" $tls }}
  {{- end }}
  {{- $_ := set $configs $registry_parts $registryConfig }}
{{- end }}
{{- range .cri.registry.auths | default list }}
  {{- $parts := .registry | splitList "/" | first }}
  {{- $skip_tls := true }}
  {{- if hasKey . "skip_tls_verify" }}
  {{- $skip_tls = .skip_tls_verify | toBool }}
  {{- end }}
  {{- $auth := dict "username" .username "password" .password }}
  {{- $registryConfig := dict "auth" $auth }}
  {{- if not $containerdV2 }}
  {{- $tls := dict "insecure_skip_verify" $skip_tls }}
  {{- if .ca_file }}
  {{- $_ := set $tls "ca_file" .ca_file }}
  {{- end }}
  {{- if .cert_file }}
  {{- $_ := set $tls "cert_file" .cert_file }}
  {{- end }}
  {{- if .key_file }}
  {{- $_ := set $tls "key_file" .key_file }}
  {{- end }}
  {{- $_ := set $registryConfig "tls" $tls }}
  {{- end }}
  {{- $_ := set $configs $parts $registryConfig }}
{{- end }}

{{- /* containerd 1.x uses config version 2 with the single `io.containerd.grpc.v1.cri`
       plugin; containerd 2.x uses config version 3 and splits CRI into
       `io.containerd.cri.v1.images` (sandbox/pinned images + registry) and
       `io.containerd.cri.v1.runtime` (runtimes + cni). The sandbox image key moved from
       `sandbox_image` (flat, under grpc.v1.cri) to `pinned_images.sandbox` (under
       cri.v1.images). The previous template hard-coded `io.containerd.grpc.v1.cri` for both
       versions, so on containerd 2.x the sandbox image landed in a plugin id that 2.x no longer
       reads and the pause image was never set. Emit the version that matches the installed
       containerd and the matching plugin layout. */}}
{{- $sandboxImage := printf "%s/%s:%s" .kubernetes.sandbox_image.registry .kubernetes.sandbox_image.repository .kubernetes.sandbox_image.tag }}
{{- if $containerdV2 }}
{{- /* containerd 2.x: config version 3 with the split CRI plugins. The default
       cri.containerd.config ships the v1 layout (version 2 + io.containerd.grpc.v1.cri),
       so for v2 we rebuild the plugin section instead of merging it in: keep the base
       settings (root, state, grpc, ...) and replace the plugins with
       io.containerd.cri.v1.images (sandbox + registry) and
       io.containerd.cri.v1.runtime (runtimes). The deprecated grpc.v1.cri plugin is dropped. */}}
{{- $_ := set $config "version" 3 }}
{{- $plugins := dig "plugins" dict $config }}
{{- $_ := unset $plugins "io.containerd.grpc.v1.cri" }}
{{- $registry := dict "config_path" "/etc/containerd/certs.d" }}
{{- if $configs }}{{- $_ := set $registry "configs" $configs }}{{- end }}
{{- $images := dict "pinned_images" (dict "sandbox" $sandboxImage) "registry" $registry }}
{{- $_ := set $plugins "io.containerd.cri.v1.images" $images }}
{{- $runtime := dict "containerd" (dict "runtimes" (dict "runc" (dict "runtime_type" "io.containerd.runc.v2" "options" (dict "SystemdCgroup" ((.cri.cgroup_driver | default "systemd") | eq "systemd"))))) }}
{{- $_ := set $plugins "io.containerd.cri.v1.runtime" $runtime }}
{{- $_ := set $config "plugins" $plugins }}
{{- else }}
{{- /* containerd 1.x: version 2, single CRI plugin */}}
{{- $cri := dict "sandbox_image" $sandboxImage }}
{{- if or $mirrors $configs }}
{{- $registry := dict }}
{{- if $mirrors }}{{- $_ := set $registry "mirrors" $mirrors }}{{- end }}
{{- if $configs }}{{- $_ := set $registry "configs" $configs }}{{- end }}
{{- $_ := set $cri "registry" $registry }}
{{- end }}
{{- $plugins := dict "io.containerd.grpc.v1.cri" $cri }}
{{- $config = mergeOverwrite (dict "version" 2 "plugins" $plugins) $config }}
{{- end }}
{{- if and (.cri.containerd.config_policy | eq "merge") (.containerd_config_existing | default dict) }}
  {{- $existing_stdout := .containerd_config_existing.stdout | default "" }}
  {{- $err := .containerd_config_existing.error | default "" }}
  {{- if and ($err | empty) ($existing_stdout | empty | not) }}
    {{- $existing := $existing_stdout | fromTOML }}
    {{- if $containerdV2 }}
    {{- /* A node that ran v1 keeps registry.mirrors and registry.configs.<host>.tls in its file.
           containerd v2 refuses such a file as soon as config_path is set ("`mirrors` cannot be
           set when `config_path` is provided", internal/cri/config/config.go) and no longer knows
           the `tls` field at all, so the CRI image plugin does not load and the node cannot create
           containers. Drop the registry section (both the legacy grpc.v1.cri and the new
           cri.v1.images ids) before the merge; credentials are re-rendered below and everything
           else is merged with the node's keys taking precedence. */}}
    {{- $existing_plugins := dig "plugins" dict $existing }}
    {{- $existing_images := dig "io.containerd.cri.v1.images" dict $existing_plugins }}
    {{- $_ := unset $existing_images "registry" }}
    {{- $_ := set $existing_plugins "io.containerd.cri.v1.images" $existing_images }}
    {{- $existing_cri := dig "io.containerd.grpc.v1.cri" dict $existing_plugins }}
    {{- $_ := unset $existing_cri "registry" }}
    {{- $_ := set $existing_plugins "io.containerd.grpc.v1.cri" $existing_cri }}
    {{- $_ := set $existing "plugins" $existing_plugins }}
    {{- else }}
    {{- /* v1: drop the legacy registry section the same way before merging. */}}
    {{- $existing_plugins := dig "plugins" dict $existing }}
    {{- $existing_cri := dig "io.containerd.grpc.v1.cri" dict $existing_plugins }}
    {{- $_ := unset $existing_cri "registry" }}
    {{- $_ := set $existing_plugins "io.containerd.grpc.v1.cri" $existing_cri }}
    {{- $_ := set $existing "plugins" $existing_plugins }}
    {{- end }}
    {{- $config = mergeOverwrite $config $existing }}
    {{- if $containerdV2 }}
    {{- /* a v1 node keeps io.containerd.grpc.v1.cri (deprecated in v2); drop it and
           pin the version so the merged file is a clean v3 layout. */}}
    {{- $merged_plugins := dig "plugins" dict $config }}
    {{- $_ := unset $merged_plugins "io.containerd.grpc.v1.cri" }}
    {{- $_ := set $config "plugins" $merged_plugins }}
    {{- $_ := set $config "version" 3 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /* normalize SystemdCgroup to a bool in the runc options, under the plugin id the
       running containerd actually uses. */}}
{{- $criPlugin := "io.containerd.grpc.v1.cri" }}
{{- if $containerdV2 }}{{- $criPlugin = "io.containerd.cri.v1.runtime" }}{{- end }}
{{- $options := dig "plugins" $criPlugin "containerd" "runtimes" "runc" "options" dict $config }}
{{- if $options }}
{{- if hasKey $options "SystemdCgroup" }}
{{- $_ := set $options "SystemdCgroup" ($options.SystemdCgroup | toBool) }}
{{- end }}
{{- end }}
{{- $config | toToml }}
