  - chrony
  - conntrack
  - curl
  - ebtables
  - git
  - haproxy
  - ipset
  - ipvsadm
  - keepalived
  - lvm2
  - net-tools
  - nftables
  - openssl
  - psmisc
  - socat
  - sudo
